name: commonplace

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commonplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commonplace}
      POSTGRES_DB: ${POSTGRES_DB:-commonplace}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commonplace} -d ${POSTGRES_DB:-commonplace}"]
      interval: 3s
      retries: 20

  # Inspection only: browse tables. Pick "PostgreSQL" in the System dropdown.
  adminer:
    image: adminer:6.3.0
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ["8081:8080"]
    depends_on: [postgres]

  # Host networking so the dev server reaches the app on localhost (the app runs
  # outside Docker and stays bound to 127.0.0.1). UI and API on :8288.
  inngest:
    image: inngest/inngest:v1.53.0
    restart: unless-stopped
    network_mode: host
    command: inngest dev --no-discovery -u http://localhost:${APP_PORT:-8000}/api/inngest

  # The claim graph: claims from different publications meet at shared topics.
  memgraph:
    image: memgraph/memgraph:3.14.0
    restart: unless-stopped
    ports: ["7687:7687"]
    volumes: [memgraph_data:/var/lib/memgraph]
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 3s
      retries: 20

  # Inspection only: run Cypher and look at the graph on http://localhost:3000
  memgraph-lab:
    image: memgraph/lab:3.14.3
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: 7687
    depends_on: [memgraph]

volumes:
  pgdata:
  memgraph_data:
