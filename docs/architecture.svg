<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #475569; }
      .band { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .fn { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13.5px; fill: #334155; }
      .s { font-size: 12.5px; fill: #64748b; }
      .chip { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .lbl { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; fill: #475569; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .fnbox { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .step { fill: #e2e8f0; stroke: #cbd5e1; }
      .paid { fill: #fde7c8; stroke: #f59e0b; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>

  <text x="40" y="52" class="title">commonplace</text>
  <text x="258" y="52" class="subtitle">a personal knowledge base built from newsletters: every slow pipeline is a durable Inngest function</text>

  <!-- ================= WRITE PATH ================= -->
  <rect x="20" y="80" width="1560" height="300" rx="16" fill="#eef4ff" stroke="#c7d7f5"/>
  <text x="44" y="110" class="band" fill="#3b5ba9">WRITE PATH</text>

  <!-- sources -->
  <rect x="44" y="140" width="200" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="62" y="172" class="h">Allowlisted feeds</text>
  <text x="62" y="194" class="t">3 newsletters</text>
  <text x="62" y="213" class="s">publications.yaml</text>

  <rect x="44" y="256" width="200" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="62" y="288" class="h">You, via the API</text>
  <text x="62" y="310" class="t">add a feed or one article</text>
  <text x="62" y="329" class="s">manual adds jump the queue</text>

  <!-- triggers -->
  <rect x="280" y="140" width="222" height="86" rx="10" class="fnbox"/>
  <text x="298" y="172" class="fn">poll-feeds</text>
  <text x="298" y="194" class="t">every 5 minutes</text>
  <text x="298" y="213" class="s">conditional GET (304)</text>

  <rect x="280" y="256" width="222" height="86" rx="10" class="fnbox"/>
  <text x="298" y="288" class="fn">backfill-publication</text>
  <text x="298" y="310" class="t">every post in a feed</text>
  <text x="298" y="329" class="s">fans out one event per post</text>

  <path d="M244 183 H274" class="edge"/>
  <path d="M244 299 H274" class="edge"/>

  <!-- ingest-article -->
  <rect x="566" y="120" width="600" height="236" rx="12" class="fnbox"/>
  <text x="588" y="152" class="fn">ingest-article</text>
  <text x="588" y="176" class="s">concurrency per site · one run per article · shared throttle · priority</text>

  <rect x="588" y="202" width="84" height="44" rx="8" class="step"/><text x="630" y="229" class="chip" text-anchor="middle">fetch</text>
  <rect x="682" y="202" width="84" height="44" rx="8" class="step"/><text x="724" y="229" class="chip" text-anchor="middle">parse</text>
  <rect x="776" y="202" width="96" height="44" rx="8" class="step"/><text x="824" y="229" class="chip" text-anchor="middle">hash check</text>
  <rect x="882" y="202" width="84" height="44" rx="8" class="step"/><text x="924" y="229" class="chip" text-anchor="middle">chunk</text>
  <rect x="976" y="202" width="84" height="44" rx="8" class="paid"/><text x="1018" y="229" class="chip" text-anchor="middle">embed</text>
  <rect x="1070" y="202" width="84" height="44" rx="8" class="step"/><text x="1112" y="229" class="chip" text-anchor="middle">persist</text>

  <path d="M824 246 V278 H600" class="edge" stroke-dasharray="4 4"/>
  <text x="836" y="276" class="s">unchanged text: stop before the paid embed call</text>
  <text x="588" y="312" class="t">each step's result is saved, so a retry resumes after</text>
  <text x="588" y="331" class="t">the last finished step and never pays for an embedding twice</text>

  <path d="M502 183 H560" class="edge"/>
  <path d="M502 299 H526 V183" stroke="#475569" stroke-width="1.8" fill="none"/>
  <text transform="translate(546 268) rotate(-90)" class="lbl" text-anchor="middle">article.discovered</text>

  <!-- extract-claims -->
  <rect x="1222" y="120" width="334" height="236" rx="12" class="fnbox"/>
  <text x="1244" y="152" class="fn">extract-claims</text>
  <text x="1244" y="176" class="s">new or edited articles only</text>

  <rect x="1244" y="202" width="134" height="44" rx="8" class="paid"/><text x="1311" y="229" class="chip" text-anchor="middle">extract claims</text>
  <rect x="1388" y="202" width="146" height="44" rx="8" class="step"/><text x="1461" y="229" class="chip" text-anchor="middle">verbatim quote</text>
  <path d="M1378 224 H1386" stroke="#475569" stroke-width="1.8"/>
  <text x="1244" y="290" class="t">a claim is kept only if its quote</text>
  <text x="1244" y="309" class="t">is really in the article (checked in code)</text>
  <text x="1244" y="331" class="s">measurement · opinion · prediction · ...</text>

  <path d="M1166 238 H1216" class="edge"/>
  <text x="1194" y="228" class="lbl" text-anchor="middle" font-size="10.5">ingested</text>

  <!-- ================= STORAGE ================= -->
  <rect x="20" y="398" width="1560" height="150" rx="16" fill="#f5f5f4" stroke="#e2e2df"/>
  <text x="44" y="428" class="band" fill="#57534e">STORAGE</text>

  <!-- postgres cylinder -->
  <g>
    <path d="M330 440 V512 A180 16 0 0 0 690 512 V440" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="510" cy="440" rx="180" ry="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="510" y="480" class="h" text-anchor="middle">Postgres + pgvector</text>
    <text x="510" y="502" class="s" text-anchor="middle">articles · passages with history · claims</text>
    <text x="510" y="520" class="s" text-anchor="middle">answers · evals · research runs · costs</text>
  </g>

  <!-- memgraph cylinder -->
  <g>
    <path d="M890 440 V512 A170 16 0 0 0 1230 512 V440" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="1060" cy="440" rx="170" ry="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1060" y="480" class="h" text-anchor="middle">Memgraph</text>
    <text x="1060" y="502" class="s" text-anchor="middle">Publication · Article · Author</text>
    <text x="1060" y="520" class="s" text-anchor="middle">Claim · Topic (shared across authors)</text>
  </g>

  <text x="1290" y="470" class="t">Nothing is deleted:</text>
  <text x="1290" y="490" class="t">an edit supersedes old passages</text>
  <text x="1290" y="510" class="t">and claims, so old answers</text>
  <text x="1290" y="530" class="t">stay traceable</text>

  <!-- write edges into storage -->
  <path d="M600 356 V420" class="edge"/>
  <path d="M1300 356 V384 H660 V420" class="edge"/>
  <path d="M1420 356 V392 H1100 V420" class="edge"/>

  <!-- ================= READ PATH ================= -->
  <rect x="20" y="566" width="1560" height="440" rx="16" fill="#eef8f1" stroke="#c5e4cf"/>
  <text x="44" y="596" class="band" fill="#2f7a4b">READ PATH</text>

  <!-- clients -->
  <rect x="44" y="626" width="200" height="360" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="62" y="658" class="h">You</text>
  <rect x="60" y="676" width="168" height="76" rx="8" class="step"/>
  <text x="74" y="704" class="chip">HTTP API</text>
  <text x="74" y="724" class="s">FastAPI</text>
  <text x="74" y="741" class="s">/search /ask /research</text>
  <rect x="60" y="766" width="168" height="76" rx="8" class="step"/>
  <text x="74" y="794" class="chip">MCP tools</text>
  <text x="74" y="814" class="s">13 tools, used from</text>
  <text x="74" y="831" class="s">Claude Code</text>
  <text x="62" y="880" class="s">every citation traces</text>
  <text x="62" y="898" class="s">back to the exact text:</text>
  <text x="62" y="916" class="lbl">GET /sources/&lt;id&gt;</text>

  <!-- hybrid retrieval -->
  <rect x="296" y="626" width="428" height="200" rx="12" class="fnbox"/>
  <rect x="318" y="648" width="122" height="44" rx="8" class="step"/><text x="379" y="675" class="chip" text-anchor="middle">full-text</text>
  <rect x="449" y="648" width="122" height="44" rx="8" class="step"/><text x="510" y="675" class="chip" text-anchor="middle">vectors</text>
  <rect x="580" y="648" width="122" height="44" rx="8" class="step"/><text x="641" y="675" class="chip" text-anchor="middle">claim graph</text>
  <path d="M379 692 V716" class="edge"/>
  <path d="M510 692 V716" class="edge"/>
  <path d="M641 692 V716" class="edge"/>
  <rect x="318" y="722" width="384" height="52" rx="8" fill="#d9f0e1" stroke="#9fd3b0"/>
  <text x="510" y="744" class="chip" text-anchor="middle">rank fusion (RRF)</text>
  <text x="510" y="763" class="s" text-anchor="middle">only positions are combined, never scores</text>
  <text x="318" y="808" class="h">Hybrid retrieval</text>

  <!-- storage into retrieval -->
  <path d="M379 526 V642" class="edge"/>
  <path d="M510 530 V642" class="edge"/>
  <path d="M1060 530 V600 H641 V642" class="edge"/>

  <!-- clients into retrieval -->
  <path d="M244 714 H290" class="edge"/>
  <path d="M244 804 H270 V726 H290" class="edge"/>

  <!-- ask -->
  <rect x="784" y="626" width="330" height="128" rx="12" class="fnbox"/>
  <text x="806" y="658" class="fn">ask</text>
  <rect x="806" y="672" width="152" height="36" rx="8" class="paid"/><text x="882" y="695" class="chip" text-anchor="middle">answer (Claude)</text>
  <text x="806" y="728" class="t">from retrieved passages only,</text>
  <text x="806" y="746" class="t">with [n] citations</text>
  <path d="M724 690 H778" class="edge"/>

  <!-- evaluate -->
  <rect x="1176" y="626" width="380" height="128" rx="12" class="fnbox"/>
  <text x="1198" y="658" class="fn">evaluate-answer</text>
  <rect x="1198" y="672" width="122" height="36" rx="8" class="step"/><text x="1259" y="695" class="chip" text-anchor="middle">code checks</text>
  <rect x="1330" y="672" width="140" height="36" rx="8" class="paid"/><text x="1400" y="695" class="chip" text-anchor="middle">2 binary judges</text>
  <text x="1198" y="728" class="t">faithfulness, disagreement coverage</text>
  <text x="1198" y="746" class="t">the score becomes the answer's confidence</text>
  <path d="M1114 690 H1170" class="edge"/>
  <text x="1145" y="667" class="lbl" text-anchor="middle" font-size="10.5">answer.</text>
  <text x="1145" y="680" class="lbl" text-anchor="middle" font-size="10.5">produced</text>

  <!-- research -->
  <rect x="784" y="790" width="500" height="196" rx="12" class="fnbox"/>
  <text x="806" y="822" class="fn">run-research-agent</text>
  <rect x="806" y="840" width="86" height="40" rx="8" class="paid"/><text x="849" y="865" class="chip" text-anchor="middle">plan</text>
  <rect x="922" y="840" width="122" height="40" rx="8" class="step"/><text x="983" y="865" class="chip" text-anchor="middle">search hop n</text>
  <rect x="1074" y="840" width="96" height="40" rx="8" class="paid"/><text x="1122" y="865" class="chip" text-anchor="middle">reflect</text>
  <rect x="1188" y="840" width="80" height="40" rx="8" class="paid"/><text x="1228" y="865" class="chip" text-anchor="middle">report</text>
  <path d="M892 860 H916" class="edge"/>
  <path d="M1044 860 H1068" class="edge"/>
  <path d="M1170 860 H1182" class="edge"/>
  <path d="M1122 880 V900 H983 V886" class="edge"/>
  <text x="1052" y="916" class="lbl" text-anchor="middle">more queries</text>
  <text x="806" y="938" class="t">the loop stops in code, not by the model:</text>
  <text x="806" y="958" class="t">no new evidence · iteration cap · dollar budget</text>
  <text x="806" y="976" class="s">each hop is a durable step, named hop-1, hop-2, ...</text>
  <path d="M724 806 H760 V876 H778" class="edge"/>

  <!-- digest -->
  <rect x="1316" y="790" width="240" height="196" rx="12" class="fnbox"/>
  <text x="1338" y="822" class="fn">weekly-digest</text>
  <rect x="1338" y="840" width="120" height="40" rx="8" class="paid"/><text x="1398" y="865" class="chip" text-anchor="middle">briefing</text>
  <text x="1338" y="920" class="t">Mondays 08:00 UTC</text>
  <text x="1338" y="940" class="t">written from verified</text>
  <text x="1338" y="960" class="t">claims, citations checked</text>

  <!-- ================= LEGEND ================= -->
  <rect x="40" y="1030" width="40" height="24" rx="6" class="fnbox"/>
  <text x="90" y="1047" class="t">Inngest function (durable, retried, rate limited)</text>
  <rect x="452" y="1030" width="40" height="24" rx="6" class="step"/>
  <text x="502" y="1047" class="t">step, saved once it finishes</text>
  <rect x="728" y="1030" width="40" height="24" rx="6" class="paid"/>
  <text x="778" y="1047" class="t">paid model call (OpenAI embeddings, Claude), cost recorded</text>
  <rect x="1250" y="1030" width="40" height="24" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="1300" y="1047" class="t">outside the system</text>
</svg>
