[project]
name = "commonplace"
version = "0.1.0"
description = "A personal knowledge base built from what I read: durable ingestion, hybrid search, cited answers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "inngest>=0.5.20",
    "openai>=3.57.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commonplace"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["commonplace", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # trafilatura imports urllib3.contrib.socks unconditionally; we never use SOCKS.
    "ignore:SOCKS support in urllib3:urllib3.exceptions.DependencyWarning",
    # raised inside the inngest SDK's own models, nothing we can change here
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:inngest.*",
]
