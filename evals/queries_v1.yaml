# Retrieval eval set. Each query has one article that clearly answers it.
# "keyword" queries reuse words from the article; "paraphrase" queries say the
# same thing in different words, which is where sparse search should struggle.
queries:
  - q: SMT solver used in production pipelines at Amazon
    expect: latent.space/p/formal-verification
    kind: keyword
  - q: how can engineers keep AI generated code from being low quality
    expect: latent.space/p/formal-verification
    kind: paraphrase
  - q: Lean proof of the Riemann Hypothesis
    expect: latent.space/p/ainews-riemann-hypothesis-proved-twice-independently
    kind: keyword
  - q: famous unsolved math conjecture cracked with help from an AI model
    expect: latent.space/p/ainews-riemann-hypothesis-proved-twice-independently
    kind: paraphrase
  - q: largest IPO in history beating SpaceX
    expect: latent.space/p/ainews-anthropic-successfully-completes-largest-ipo-in-history-valued-at-1-5t
    kind: keyword
  - q: founders keep majority voting control after the company goes public
    expect: latent.space/p/ainews-anthropic-successfully-completes-largest-ipo-in-history-valued-at-1-5t
    kind: paraphrase
  - q: why Linear never hired an SDR
    expect: latent.space/p/linear-scaling
    kind: keyword
  - q: how much of the work in a project tracker is now created by AI agents
    expect: latent.space/p/linear-scaling
    kind: paraphrase
  - q: Gemini 4 Neon price per million tokens
    expect: latent.space/p/ainews-gemini-4-neon-gdm-s-opus-sol-contender
    kind: keyword
  - q: Google mid-sized model named after a chemical element
    expect: latent.space/p/ainews-gemini-4-neon-gdm-s-opus-sol-contender
    kind: paraphrase
