# Questions with a known right answer in this corpus, for comparing retrievers.
#
# Each case names the article(s) that answer the question. A retriever is scored
# on its first `k` passages, the ones that would reach a prompt: whether the
# expected articles are among the articles those passages come from (recall@k),
# and how high the first of them ranks among those articles (reciprocal rank).
#
# How this was made: written by the assistant from the claims extracted for each
# article, one or two questions per chosen article, then grouped by what makes
# the question hard. The expected articles are the ones each question was written
# from; other articles may also be relevant, so recall here is a lower bound.
# The cases are tied to the three feeds as backfilled on 2026-11-22: after a
# fresh backfill of newer posts, the suite reports which expected articles are
# missing and leaves them out of the scores instead of counting them as misses.
#
# Categories:
#   keyword            the question reuses the article's own words
#   identifier         the question hinges on an exact name, version or number
#   paraphrase         the question avoids the article's vocabulary
#   cross_publication  the answer is spread over articles from different feeds

suite_name: golden_v1
k: 5

cases:
  - case_id: kw-01
    category: keyword
    question: Will RoPE remain the predominant position embedding method?
    expected_canonical_ids: ["pub:ahead-of-ai:understanding-positional-embeddings"]
  - case_id: kw-02
    category: keyword
    question: How much KV cache reduction and decoding throughput does Kimi Linear achieve compared to full attention?
    expected_canonical_ids: ["pub:ahead-of-ai:beyond-standard-llms"]
  - case_id: kw-03
    category: keyword
    question: Why does grouped-query attention remain appealing compared with MLA?
    expected_canonical_ids: ["pub:ahead-of-ai:visual-attention-variants"]
  - case_id: kw-04
    category: keyword
    question: At what price per share was the Anthropic IPO priced and where did it close on the first day?
    expected_canonical_ids:
      ["pub:latent-space:ainews-anthropic-successfully-completes-largest-ipo-in-history-valued-at-1-5t"]
  - case_id: kw-05
    category: keyword
    question: How was LiteLLM compromised through an API key committed to GitHub?
    expected_canonical_ids: ["pub:interconnects:podcast-kimi-k31-pro-the-new-cyber"]
  - case_id: kw-06
    category: keyword
    question: Which email provider did Claude Code recommend first in the AEO study?
    expected_canonical_ids: ["pub:latent-space:resend"]

